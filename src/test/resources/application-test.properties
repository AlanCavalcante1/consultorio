# --- BANCO DE DADOS H2 (EM MEM\u00D3RIA) ---
# A url "mem" indica que o banco vive na mem\u00F3ria RAM. Fechou o teste, os dados somem.
spring.datasource.url=jdbc:h2:mem:consultoriodb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
# Driver oficial do H2
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# --- JPA / HIBERNATE ---
# create-drop: Cria as tabelas no in\u00EDcio do teste e DESTR\u00D3I ao final.
# Garante que um teste n\u00E3o deixe "sujeira" para o pr\u00F3ximo.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Desabilita o log do SQL para n\u00E3o poluir o console de testes (opcional)
spring.jpa.show-sql=false
# --- LIQUIBASE / FLYWAY (Se usar) ---
# Em testes, geralmente deixamos o Hibernate criar o banco (create-drop)
# ou desabilitamos o Flyway para ganhar velocidade.
spring.flyway.enabled=false
spring.liquibase.enabled=false