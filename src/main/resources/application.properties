spring.application.name=consultorio-api
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=dev
spring.jpa.hibernate.ddl-auto=validate
# --- Configuracoes do Flyway ---
spring.flyway.enabled=true
# Define onde o Flyway deve procurar os scripts de migracao
spring.flyway.locations=classpath:db/migration
# Cria automaticamente a tabela flyway_schema_history se ela nao existir
# E aplica todas as migracoes pendentes
spring.flyway.baseline-on-migrate=true
# Garante integridade: Se algu\u00E9m alterou um script que ja rodou, o app nao sobe.
spring.flyway.validate-on-migrate=true
api.security.token.secret=${JWT_SECRET}
api.security.token.issuer=${JWT_ISSUER}
# Formato do log para mostrar o TraceID
logging.pattern.console=%d{HH:mm:ss.SSS} %5p [%X{traceId:-}] %logger{40} : %m%n