spring.application.name=consultorio-api

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.config.import=optional:file:.env[.properties]
spring.profiles.active=dev

spring.jpa.hibernate.ddl-auto=validate

# --- Configurações do Flyway ---
spring.flyway.enabled=true

# Define onde o Flyway deve procurar os scripts de migração
spring.flyway.locations=classpath:db/migration

# Cria automaticamente a tabela flyway_schema_history se ela não existir
# E aplica todas as migrações pendentes
spring.flyway.baseline-on-migrate=true

# Garante integridade: Se alguém alterou um script que já rodou, o app não sobe.
spring.flyway.validate-on-migrate=true